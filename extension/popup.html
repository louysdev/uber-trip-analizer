<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 300px;
    font-family: 'Inter', system-ui, 'Helvetica Neue', Arial, sans-serif;
    background: #ffffff;
    color: #000000;
    -webkit-font-smoothing: antialiased;
  }

  /* Header — black bar */
  .popup-header {
    background: #000000;
    color: #ffffff;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .popup-header svg {
    flex-shrink: 0;
  }
  .popup-header h1 {
    font-size: 14px;
    font-weight: 700;
    line-height: 20px;
    letter-spacing: -0.1px;
  }
  .popup-header .version {
    font-size: 11px;
    color: #afafaf;
    font-weight: 400;
    margin-left: auto;
  }

  /* Body */
  .popup-body {
    padding: 16px;
  }

  .status-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid #e2e2e2;
    font-size: 14px;
    font-weight: 400;
    line-height: 20px;
  }
  .status-item:last-of-type { border-bottom: none; }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot.green { background: #2ecc71; }
  .dot.red { background: #e74c3c; }
  .dot.orange { background: #f39c12; }

  .label {
    color: #5e5e5e;
    font-size: 14px;
    font-weight: 400;
  }
  .value {
    margin-left: auto;
    font-weight: 500;
    color: #000000;
  }

  /* Help box */
  .help {
    margin-top: 12px;
    padding: 12px 14px;
    background: #efefef;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 400;
    color: #5e5e5e;
    line-height: 1.6;
  }
  .help a {
    color: #000000;
    font-weight: 500;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .help a:hover {
    color: #282828;
  }

  /* Action link (pill) */
  .action-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    padding: 8px 16px;
    background: #000000;
    color: #ffffff;
    border: none;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    transition: background .15s;
  }
  .action-link:hover {
    background: #282828;
  }
</style>
</head>
<body>
  <div class="popup-header">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
      <path d="m21 8-2 2-1.5-3.7A2 2 0 0 0 15.64 5H8.36a2 2 0 0 0-1.86 1.3L5 10 3 8"/>
      <path d="M7 14h.01"/>
      <path d="M17 14h.01"/>
      <rect width="18" height="8" x="3" y="10" rx="2"/>
      <path d="M5 18v2"/>
      <path d="M19 18v2"/>
    </svg>
    <h1>Uber Trip Extractor</h1>
    <span class="version" id="version"></span>
  </div>

  <div class="popup-body">
    <div class="status-item">
      <span class="dot green"></span>
      <span class="label">Extensión</span>
      <span class="value">Activa</span>
    </div>

    <div class="status-item" id="uberStatus">
      <span class="dot orange" id="uberDot"></span>
      <span class="label">Pestaña Uber</span>
      <span class="value" id="uberValue">Verificando...</span>
    </div>

    <div class="help" id="helpText"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
