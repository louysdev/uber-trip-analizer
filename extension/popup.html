<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 300px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #0f0f0f;
    color: #e0e0e0;
    padding: 16px;
  }
  h1 {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .version { font-size: 11px; color: #999; font-weight: 400; }
  .status-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid #242424;
    font-size: 13px;
  }
  .status-item:last-child { border-bottom: none; }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot.green { background: #2ecc71; }
  .dot.red { background: #e74c3c; }
  .dot.orange { background: #f39c12; }
  .label { color: #999; }
  .value { margin-left: auto; font-weight: 500; }
  .help {
    margin-top: 12px;
    padding: 10px;
    background: #1a1a1a;
    border-radius: 6px;
    font-size: 11px;
    color: #999;
    line-height: 1.5;
  }
  .help a { color: #4a8bf5; text-decoration: none; }
  .help a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <h1>
    🚗 Uber Trip Extractor
    <span class="version" id="version"></span>
  </h1>

  <div class="status-item">
    <span class="dot green"></span>
    <span class="label">Extensión</span>
    <span class="value">Activa</span>
  </div>

  <div class="status-item" id="uberStatus">
    <span class="dot orange" id="uberDot"></span>
    <span class="label">Pestaña Uber</span>
    <span class="value" id="uberValue">Verificando...</span>
  </div>

  <div class="help" id="helpText"></div>

  <script src="popup.js"></script>
</body>
</html>
